<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone-Vorschau – Kommt gleich</title>
<link rel="icon" href="/icon.svg">
<style>
  :root {
    --bg: #eceae6; --text: #1c1917; --muted: #78716c; --card: #fff; --line: #d6d3d1;
    --marke: #e8590c; --rahmen: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --text: #f5f5f4; --muted: #a8a29e; --card: #232120; --line: #3a3735; --rahmen: #3a3a3c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Kopfzeile der Vorschau */
  header.leiste {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header.leiste h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header.leiste h1 img { width: 22px; height: 22px; }
  header.leiste h1 span { color: var(--marke); }
  .tipp { color: var(--muted); font-size: 12px; flex: 1; min-width: 200px; }
  .knopf {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .knopf:hover { border-color: var(--marke); }
  select.knopf { padding-right: 6px; }
  main {
    flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start;
    gap: 48px; padding: 18px 16px; overflow: auto;
  }
  .spalte { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .titel { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .titel small { color: var(--muted); font-weight: 400; }
  .hinweis { color: var(--muted); font-size: 12px; max-width: 360px; text-align: center; min-height: 17px; }

  /* Das iPhone: Bildschirm 393 x 852 (iPhone 15/16), per --skala verkleinert */
  .halter { width: calc(417px * var(--skala, 1)); height: calc(876px * var(--skala, 1)); }
  .iphone {
    width: 417px; height: 876px; padding: 12px; border-radius: 68px; background: var(--rahmen);
    box-shadow: 0 0 0 2px #5a5a5e inset, 0 30px 60px -20px rgba(0,0,0,.45);
    transform: scale(var(--skala, 1)); transform-origin: top left; position: relative;
  }
  .bildschirm {
    width: 393px; height: 852px; border-radius: 56px; overflow: hidden; background: #fff;
    position: relative; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: #000;
  }
  .statusbar {
    height: 54px; flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 4px 30px 0 52px; font-weight: 600; font-size: 16px; position: relative; z-index: 3;
  }
  .statusbar.hell { color: #fff; }
  .statusbar .symbole { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { height: 12px; fill: currentColor; }
  .insel { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 6; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.85); pointer-events: none; z-index: 6; }
  .home.hell { background: rgba(255,255,255,.9); }
  iframe { border: 0; width: 393px; flex: 1; display: block; background: #fff; }

  /* Kunden-iPhone: drei Ansichten */
  .ansicht { position: absolute; inset: 0; display: none; flex-direction: column; }
  .ansicht.an { display: flex; }

  /* 1) Sperrbildschirm */
  #sperre { background: radial-gradient(120% 70% at 30% 0%, #ffb27a 0%, #e8590c 38%, #7a2a0c 75%, #2a120a 100%); color: #fff; }
  .sperre-kopf { text-align: center; margin-top: 4px; }
  .sperre-datum { font-size: 19px; font-weight: 600; opacity: .92; }
  .sperre-zeit { font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -2px; margin-top: 2px; }
  .mitteilungen { flex: 1; overflow-y: auto; padding: 18px 10px 108px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .mitteilung {
    background: rgba(250,250,250,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #000; border-radius: 22px; padding: 12px 14px; display: flex; gap: 10px; cursor: pointer;
    text-align: left; border: 0; font: inherit; width: 100%; animation: rein .35s ease-out;
  }
  .mitteilung:active { transform: scale(.98); }
  .app-symbol { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(#5ef777, #28c840); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .app-symbol svg { width: 24px; height: 24px; fill: #fff; stroke: none; }
  .m-inhalt { min-width: 0; flex: 1; }
  .m-kopf { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .m-kopf b { font-weight: 600; }
  .m-kopf span { color: rgba(60,60,67,.6); font-size: 14px; }
  .m-text { font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .sperre-leer { text-align: center; opacity: .75; font-size: 14px; padding-bottom: 8px; }
  .sperre-fuss { position: absolute; bottom: 36px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 46px; pointer-events: none; }
  .sperre-fuss div { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .sperre-fuss svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; }

  /* 2) Nachrichten */
  #nachrichten { background: #fff; }
  .n-kopf { display: flex; flex-direction: column; align-items: center; padding: 0 12px 10px; border-bottom: .5px solid #d1d1d6; background: rgba(249,249,249,.94); position: relative; }
  .n-zurueck { position: absolute; left: 10px; top: 6px; color: #007aff; border: 0; background: none; font: inherit; font-size: 17px; display: flex; align-items: center; cursor: pointer; padding: 4px; }
  .n-zurueck svg { width: 26px; height: 26px; stroke-width: 2.4; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(#a5a5aa, #86868b); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; }
  .n-name { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 2px; }
  .n-verlauf { flex: 1; overflow-y: auto; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
  .n-trenner { text-align: center; color: #8e8e93; font-size: 12px; margin: 10px 0 4px; }
  .n-trenner b { font-weight: 600; }
  .blase { align-self: flex-start; max-width: 78%; background: #e9e9eb; border-radius: 18px; padding: 8px 12px; font-size: 16px; line-height: 1.3; word-break: break-word; animation: rein .3s ease-out; }
  .blase a { color: #007aff; text-decoration: underline; cursor: pointer; }
  .n-eingabe { display: flex; align-items: center; gap: 8px; padding: 8px 12px 34px; }
  .n-eingabe div { flex: 1; border: 1px solid #d1d1d6; border-radius: 18px; padding: 7px 12px; color: #c7c7cc; font-size: 16px; }

  /* 3) Browser */
  #browser { background: #fff; }
  #browser iframe { flex: 1; }
  .b-leiste { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 30px; background: rgba(249,249,249,.96); border-top: .5px solid #d1d1d6; }
  .b-leiste button { border: 0; background: none; color: #007aff; cursor: pointer; padding: 4px; display: flex; }
  .b-leiste button svg { width: 24px; height: 24px; stroke-width: 2.2; }
  .b-adresse { flex: 1; background: #e3e3e8; border-radius: 12px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 15px; color: #000; overflow: hidden; white-space: nowrap; }
  .b-adresse svg { width: 13px; height: 13px; color: #6b6b70; }

  /* Mitteilung oben (wenn das Handy entsperrt ist) */
  .banner {
    position: absolute; left: 8px; right: 8px; top: 52px; z-index: 5; transform: translateY(-160%);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.1), opacity .25s; opacity: 0; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.18);
    background: rgba(245,245,245,.95);
  }
  .banner.zeigen { transform: translateY(0); opacity: 1; pointer-events: auto; }

  @keyframes rein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (max-width: 600px) { main { gap: 24px; } }
</style>
</head>
<body>
<header class="leiste">
  <h1><img src="/icon.svg" alt=""> iPhone-Vorschau · <span>Kommt gleich</span></h1>
  <div class="tipp">Links tippst du als Handwerker auf „Losgefahren“. Rechts kommt beim Kunden die SMS an: Mitteilung antippen, dann den Link.</div>
  <label>Größe
    <select id="groesse" class="knopf">
      <option value="auto">Passend</option><option value="1">100 %</option><option value="0.8">80 %</option><option value="0.65">65 %</option>
    </select>
  </label>
  <button id="zuruecksetzen" class="knopf" title="Alle Aufträge von heute neu anlegen und SMS löschen">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg> Demo zurücksetzen
  </button>
</header>

<main>
  <div class="spalte">
    <div class="titel">
      <svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.3-.4-.4-2.3z"/></svg>
      Handwerker <small>App</small>
    </div>
    <div class="halter"><div class="iphone"><div class="bildschirm">
      <div class="insel"></div>
      <div class="statusbar" data-statusbar></div>
      <iframe id="h" title="Handwerker-iPhone"></iframe>
      <div class="home"></div>
    </div></div></div>
    <div class="hinweis">Demo-Zugang ist schon eingetragen.</div>
  </div>

  <div class="spalte">
    <div class="titel">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg>
      Kunde <small id="kundeName">bekommt die SMS</small>
    </div>
    <div class="halter"><div class="iphone"><div class="bildschirm" id="kundenBildschirm">
      <div class="insel"></div>
      <div class="statusbar hell" data-statusbar id="kundenStatus"></div>

      <!-- Mitteilung oben -->
      <button class="mitteilung banner" id="banner" type="button"></button>

      <!-- 1) Sperrbildschirm -->
      <section class="ansicht an" id="sperre">
        <div style="height:54px;flex:none"></div>
        <div class="sperre-kopf">
          <div class="sperre-datum" id="sperreDatum"></div>
          <div class="sperre-zeit" id="sperreZeit"></div>
        </div>
        <div class="mitteilungen" id="mitteilungen"></div>
        <div class="sperre-fuss">
          <div><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 13v8"/></svg></div>
          <div><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></div>
        </div>
      </section>

      <!-- 2) Nachrichten -->
      <section class="ansicht" id="nachrichten">
        <div style="height:54px;flex:none;background:rgba(249,249,249,.94)"></div>
        <div class="n-kopf">
          <button class="n-zurueck" id="nZurueck" type="button" aria-label="Zurück">
            <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="avatar" id="nAvatar"></div>
          <div class="n-name"><span id="nName"></span>
            <svg class="i" viewBox="0 0 24 24" style="width:10px;height:10px;color:#8e8e93"><path d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div class="n-verlauf" id="nVerlauf"></div>
        <div class="n-eingabe"><div>Textnachricht</div></div>
      </section>

      <!-- 3) Browser -->
      <section class="ansicht" id="browser">
        <div style="height:54px;flex:none"></div>
        <iframe id="k" title="Kunden-iPhone"></iframe>
        <div class="b-leiste">
          <button id="bZurueck" type="button" aria-label="Zurück zu Nachrichten">
            <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="b-adresse">
            <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span id="bHost"></span>
          </div>
          <button id="bNeu" type="button" aria-label="Neu laden">
            <svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg>
          </button>
        </div>
      </section>

      <div class="home hell" id="kundenHome"></div>
    </div></div></div>
    <div class="hinweis" id="hinweis">Wartet auf eine SMS vom Betrieb …</div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const ZONE = "Europe/Berlin"; // gleiche Zeitzone wie die App, egal wo der PC steht
  const params = new URLSearchParams(location.search);
  const BLASE_SVG = '<svg viewBox="0 0 24 24"><path d="M12 3.5c-5 0-9 3.3-9 7.4 0 2.4 1.4 4.5 3.5 5.9-.2 1.4-.9 2.6-1.9 3.4 2 0 3.8-.8 5-1.9.8.2 1.6.3 2.4.3 5 0 9-3.3 9-7.4s-4-7.7-9-7.7z"/></svg>';

  // ---------- Statusleiste ----------
  const SYMBOLE = '<span class="symbole">' +
    '<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>' +
    '<svg viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.7 10.7 0 0 0 8 .4C5.1.4 2.4 1.5.5 3.4l1.2 1.3A9 9 0 0 1 8 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.3-1.3A7.1 7.1 0 0 0 8 4c-1.9 0-3.7.7-5 1.9l1.3 1.3c1-.9 2.3-1.4 3.7-1.4zM8 9.4c-.6 0-1.2.2-1.6.6L8 11.7 9.6 10c-.4-.4-1-.6-1.6-.6z"/></svg>' +
    '<svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2"/><path d="M24.5 4v4a2 2 0 0 0 0-4z" opacity=".5"/></svg>' +
    "</span>";
  const zeitText = (d = new Date()) => d.toLocaleTimeString("de-DE", { timeZone: ZONE, hour: "numeric", minute: "2-digit" });
  function uhr() {
    const z = zeitText();
    document.querySelectorAll("[data-statusbar]").forEach((s) => (s.innerHTML = `<span>${z}</span>${SYMBOLE}`));
    $("sperreZeit").textContent = z;
    $("sperreDatum").textContent = new Date().toLocaleDateString("de-DE", { timeZone: ZONE, weekday: "long", day: "numeric", month: "long" });
  }
  uhr(); setInterval(uhr, 10_000);

  // ---------- Handwerker-iPhone ----------
  const handwerker = $("h");
  function pfad(eingabe) {
    try { const u = new URL(eingabe, location.origin); return u.pathname + u.search + u.hash; } catch { return "/login"; }
  }
  handwerker.src = pfad(params.get("h") || "/login");

  // ---------- Kunden-iPhone ----------
  let alleSms = [];          // alle Demo-SMS vom Server
  const gesehen = new Set(); // schon angezeigte SMS
  let kunde = null;          // { an, name, absender }
  let ansicht = "sperre";
  let bannerZeit = null;
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LINK = /(https?:\/\/[^\s]+\/t\/[A-Za-z0-9_-]+)/;

  function zeigen(name) {
    ansicht = name;
    for (const id of ["sperre", "nachrichten", "browser"]) $(id).classList.toggle("an", id === name);
    const dunkel = name === "sperre";
    $("kundenStatus").classList.toggle("hell", dunkel);
    $("kundenHome").classList.toggle("hell", dunkel);
    if (name === "nachrichten") { zeichneVerlauf(); $("nVerlauf").scrollTop = 1e6; }
    hinweisSetzen();
  }
  function hinweisSetzen() {
    $("hinweis").textContent = !kunde ? "Wartet auf eine SMS vom Betrieb …"
      : ansicht === "sperre" ? "Mitteilung antippen, um die SMS zu öffnen."
      : ansicht === "nachrichten" ? "Link in der SMS antippen."
      : "So sieht es der Kunde.";
  }

  const meineSms = () => (kunde ? alleSms.filter((s) => s.an === kunde.an) : []);
  const wannText = (iso) => {
    const min = Math.round((Date.now() - new Date(iso)) / 60000);
    return min < 1 ? "jetzt" : min < 60 ? `vor ${min} Min.` : zeitText(new Date(iso));
  };
  const initialen = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((t) => t[0].toUpperCase()).join("");

  function mitteilungHtml(s) {
    return `<span class="app-symbol">${BLASE_SVG}</span>
      <span class="m-inhalt">
        <span class="m-kopf"><b>${esc(s.absender)}</b><span>${wannText(s.gesendet_am)}</span></span>
        <span class="m-text">${esc(s.text)}</span>
      </span>`;
  }

  function zeichneSperre() {
    const liste = meineSms().slice().reverse();
    $("mitteilungen").innerHTML = liste.length
      ? liste.map((s) => `<button type="button" class="mitteilung" data-id="${s.id}">${mitteilungHtml(s)}</button>`).join("")
      : '<div class="sperre-leer">Keine Mitteilungen</div>';
  }

  function zeichneVerlauf() {
    if (!kunde) return;
    $("nAvatar").textContent = initialen(kunde.absender) || "?";
    $("nName").textContent = kunde.absender;
    let html = "", letzterTag = "";
    for (const s of meineSms()) {
      const d = new Date(s.gesendet_am);
      const tag = d.toLocaleDateString("de-DE", { timeZone: ZONE });
      if (tag !== letzterTag) {
        html += `<div class="n-trenner"><b>Textnachricht</b><br>Heute ${zeitText(d)}</div>`;
        letzterTag = tag;
      }
      html += `<div class="blase">${esc(s.text).replace(LINK, '<a data-link="$1">$1</a>')}</div>`;
    }
    $("nVerlauf").innerHTML = html;
  }

  function linkOeffnen(url) {
    let host = "";
    try { host = new URL(url).host; } catch {}
    $("bHost").textContent = host;
    $("k").src = pfad(url);
    zeigen("browser");
  }

  function banner(s) {
    $("banner").innerHTML = mitteilungHtml(s);
    $("banner").classList.add("zeigen");
    clearTimeout(bannerZeit);
    bannerZeit = setTimeout(() => $("banner").classList.remove("zeigen"), 5000);
  }

  function kundeWechseln(s) {
    kunde = { an: s.an, name: s.kunde, absender: s.absender };
    $("kundeName").textContent = `Handy von ${s.kunde}`;
    $("k").removeAttribute("src");
    zeigen("sperre");
  }

  async function smsAbholen(erstesMal = false) {
    let liste;
    try {
      const r = await fetch("/api/demo/sms", { cache: "no-store" });
      if (r.status === 404) { $("hinweis").textContent = "SMS-Simulation gibt es nur im Demo-Modus."; return; }
      if (!r.ok) return;
      liste = await r.json();
    } catch { return; }
    alleSms = liste;
    const neue = liste.filter((s) => !gesehen.has(s.id));
    neue.forEach((s) => gesehen.add(s.id));

    if (erstesMal) {
      if (liste.length) kundeWechseln(liste[liste.length - 1]);
    } else if (neue.length) {
      const letzte = neue[neue.length - 1];
      if (!kunde || kunde.an !== letzte.an) kundeWechseln(letzte); // SMS an einen anderen Kunden: dessen Handy zeigen
      else if (ansicht !== "sperre") banner(letzte);
      if (ansicht === "nachrichten") { zeichneVerlauf(); $("nVerlauf").scrollTop = 1e6; }
    }
    zeichneSperre();
    hinweisSetzen();
  }
  smsAbholen(true);
  setInterval(smsAbholen, 1500);

  // Antippen
  $("mitteilungen").addEventListener("click", (e) => { if (e.target.closest(".mitteilung")) zeigen("nachrichten"); });
  $("banner").addEventListener("click", () => { $("banner").classList.remove("zeigen"); zeigen("nachrichten"); });
  $("nVerlauf").addEventListener("click", (e) => { const a = e.target.closest("a[data-link]"); if (a) linkOeffnen(a.dataset.link); });
  $("nZurueck").addEventListener("click", () => zeigen("sperre"));
  $("bZurueck").addEventListener("click", () => zeigen("nachrichten"));
  $("bNeu").addEventListener("click", () => { try { $("k").contentWindow.location.reload(); } catch {} });

  // Demo zurücksetzen
  $("zuruecksetzen").addEventListener("click", async () => {
    if (!confirm("Demo zurücksetzen? Alle Aufträge und SMS von heute werden neu angelegt.")) return;
    try { await fetch("/api/demo/zuruecksetzen", { method: "POST" }); } catch {}
    alleSms = []; gesehen.clear(); kunde = null;
    $("kundeName").textContent = "bekommt die SMS";
    $("k").removeAttribute("src");
    zeigen("sperre"); zeichneSperre();
    try { handwerker.contentWindow.location.href = "/app"; } catch { handwerker.src = "/app"; }
    smsAbholen(true);
  });

  // ---------- Größe an das Fenster anpassen ----------
  function skalieren() {
    const wahl = $("groesse").value;
    let s = 1;
    if (wahl === "auto") {
      const hoehe = window.innerHeight - document.querySelector("header").offsetHeight - 90;
      const breite = (window.innerWidth - 80) / (window.innerWidth > 900 ? 2 : 1);
      s = Math.max(0.35, Math.min(1, hoehe / 876, breite / 417));
    } else s = Number(wahl);
    document.documentElement.style.setProperty("--skala", s);
    try { localStorage.setItem("iphone-groesse", wahl); } catch {}
  }
  try { const g = localStorage.getItem("iphone-groesse"); if (g) $("groesse").value = g; } catch {}
  $("groesse").addEventListener("change", skalieren);
  window.addEventListener("resize", skalieren);
  skalieren();
</script>
</body>
</html>
